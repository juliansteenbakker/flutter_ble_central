name: Bug report
description: Report a problem with flutter_ble_central
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search existing issues (open and closed) before filing a new one.
      options:
        - label: I have searched the existing issues
          required: true

  - type: checkboxes
    attributes:
      label: Have you checked the platform side?
      description: |
        This plugin is a thin wrapper around each platform's native BLE central API
        (Android `BluetoothLeScanner`, Apple `CoreBluetooth`, Windows WinRT
        `BluetoothLEAdvertisementWatcher`). Scanning behaviour, throttling, and
        permission handling are largely dictated by the OS.
      options:
        - label: The problem still occurs with the example app in this repository
          required: false
        - label: The same device is discoverable by a system or vendor BLE scanner app (e.g. nRF Connect, LightBlue)
          required: false

  - type: input
    attributes:
      label: flutter_ble_central version
      placeholder: e.g. 0.3.3
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    attributes:
      label: Device and OS version
      description: The phone/tablet/Mac/PC running the app.
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true

  - type: input
    attributes:
      label: Peripheral being scanned
      description: The BLE device you are scanning for or connecting to, if relevant.
      placeholder: e.g. nRF52832 beacon advertising a 128-bit service UUID

  - type: textarea
    attributes:
      label: Flutter doctor output
      description: Output of `flutter doctor -v`.
      render: text

  - type: textarea
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps to reproduce the behavior. A minimal reproducible sample project or code snippet is very helpful.
    validations:
      required: true

  - type: textarea
    attributes:
      label: How do you start the scan?
      description: |
        The scan call, including the `ScanSettings` and any service UUID filters you pass.
      render: dart

  - type: textarea
    attributes:
      label: Logs
      description: |
        Relevant logs, stack traces, or crash reports. Native logs are the most useful ones here:
        `adb logcat` on Android, the Xcode/Console output on iOS and macOS, or the debug console on Windows.
      render: text
