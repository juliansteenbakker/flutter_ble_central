name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

defaults:
  run:
    shell: bash

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  dependency_review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - name: 'Latest stable'
            use_version_file: false
          - name: 'From flutter-version-file'
            use_version_file: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Flutter (${{ matrix.flutter.name }})
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ matrix.flutter.use_version_file && 'any' || 'stable' }}
          flutter-version-file: ${{ matrix.flutter.use_version_file && 'pubspec.yaml' || '' }}
          cache: true

      - name: Flutter Version Info
        run: flutter doctor -v

      - name: Cache Pub Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Lint Code
        run: flutter analyze

  formatting:
    name: Formatting
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --set-exit-if-changed .

  typecheck_swift:
    name: Swift Typecheck
    runs-on: macos-latest
    timeout-minutes: 10
    needs: analysis

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Typecheck Swift against iOS minimum
        run: |
          swiftc -typecheck \
            -target arm64-apple-ios12.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            darwin/flutter_ble_central/Sources/flutter_ble_central/*.swift \
            darwin/flutter_ble_central/Sources/flutter_ble_central/**/*.swift

      - name: Typecheck Swift against macOS minimum
        run: |
          swiftc -typecheck \
            -target arm64-apple-macos10.14 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            darwin/flutter_ble_central/Sources/flutter_ble_central/*.swift \
            darwin/flutter_ble_central/Sources/flutter_ble_central/**/*.swift
