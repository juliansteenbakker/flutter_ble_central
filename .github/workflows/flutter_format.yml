name: widget tests & code analysis

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - name: 'Latest stable'
            use_version_file: false
          - name: 'From flutter-version-file'
            use_version_file: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter ${{ matrix.flutter.name }}
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: ${{ matrix.flutter.use_version_file && 'any' || 'stable' }}
          flutter-version-file: ${{ matrix.flutter.use_version_file && 'pubspec.yaml' || '' }}

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Linter
        run: flutter analyze
