name: widget tests & code analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter:
          - name: 'From flutter-version-file'
            use_version_file: true
          - name: 'Latest stable'
            use_version_file: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3.13.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter ${{ matrix.flutter.name }}
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: 'stable'
          flutter-version-file: ${{ matrix.flutter.use_version_file && 'pubspec.yaml' || '' }}

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Linter
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub
