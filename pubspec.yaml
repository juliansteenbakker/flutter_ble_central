name: flutter_ble_central
description: A Flutter package for scanning BLE data in central mode.
version: 0.0.6

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=2.2.0"

# Generating json:  flutter pub run build_runner build --delete-conflicting-outputs

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.8.0

dev_dependencies:
  build_runner: ^2.1.8
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.1
  lint: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.steenbakker.flutter_ble_central
        pluginClass: FlutterBleCentralPlugin
      ios:
        pluginClass: FlutterBleCentralPlugin
      macos:
        pluginClass: FlutterBleCentralPlugin
      windows:
        pluginClass: FlutterBleCentralPluginCApi