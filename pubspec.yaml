name: flutter_ble_central
description: A Flutter package for scanning BLE data in central mode.
version: 0.0.3

environment:
  sdk: ">=2.17.0 <3.0.0"
  flutter: ">=2.2.0"

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.0.0

dev_dependencies:
  build_runner: ^2.1.8
  flutter_test:
    sdk: flutter
  json_serializable: ^5.0.0
  lint: ^1.10.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.steenbakker.flutter_ble_central
        pluginClass: FlutterBleCentralPlugin
      ios:
        pluginClass: FlutterBleCentralPlugin
      macos:
        pluginClass: FlutterBleCentralPlugin
