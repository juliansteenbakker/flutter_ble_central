name: flutter_ble_central
description: A Flutter package for scanning BLE data in central mode.
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

# Generating json:  dart run build_runner build --delete-conflicting-outputs

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.1.8
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.1
  very_good_analysis: ^10.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.steenbakker.flutter_ble_central
        pluginClass: FlutterBleCentralPlugin
      ios:
        pluginClass: FlutterBleCentralPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterBleCentralPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FlutterBleCentralPluginCApi